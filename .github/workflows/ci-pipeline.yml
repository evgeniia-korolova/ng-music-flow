name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm run ci-all

      - name: Lint
        run: npm run lint-all

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./client

      - name: Unit tests
        run: npm run test-all

      - name: Build
        run: npm run build-all

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ng-music-flow-build
          path: dist/ng-music-flow/browser

  notify-discord:
    needs: [build-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send PR notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
        run: |
          if [ "$BUILD_TEST_RESULT" = "success" ]; then
            STATUS="✅ CI Passed"
          else
            STATUS="❌ CI Failed"
          fi

          MESSAGE="$STATUS
          PR: #$PR_NUMBER $PR_TITLE
          Author: $PR_AUTHOR
          Result: $BUILD_TEST_RESULT
          View PR: $PR_URL"

          # jq is pre-installed on ubuntu-latest
          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
