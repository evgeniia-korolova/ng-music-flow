<div class="base-form__wrapper">
  <div class="base-form__header">
    <h3 class="base-form__title">Add file</h3>
    <app-button type="button" size="icon-rounded-md" (click)="closeForm()" aria-label="Close form">
      <app-icon icon="x"></app-icon>
    </app-button>
  </div>
  <form [formGroup]="uploadTrackForm" class="base-form" (ngSubmit)="onSubmit()">
    <div class="base-form__line">
      <label for="title" class="base-form__label">Track name:</label>
      <input
        type="text"
        placeholder="Track name..."
        formControlName="title"
        id="title"
        [class.error]="
          uploadTrackForm.controls.title.invalid && uploadTrackForm.controls.title.touched
        "
        aria-describedby="title-error"
      />
      <app-form-error [control]="uploadTrackForm.controls.title"></app-form-error>
    </div>
    <div class="base-form__line">
      <label for="artist" class="base-form__label">Artist name:</label>
      <input placeholder="Artist name..." type="text" formControlName="artist" id="artist" />
      <app-form-error [control]="uploadTrackForm.controls.artist"></app-form-error>
    </div>
    <div class="base-form__line">
      <label for="genre" class="base-form__label">Genre:</label>
      <input placeholder="Genre..." type="text" formControlName="genre" id="genre" />
      <app-form-error [control]="uploadTrackForm.controls.genre"></app-form-error>
    </div>
    <div class="base-form__line">
      <label for="file" class="base-form__label">File:</label>
      <input type="file" accept="audio/*" (change)="onFileSelected($event)" id="file" #fileInput />
    </div>
    @if (error()) {
      <div class="base-form__line text-red-700">
        {{ error() }}
      </div>
    }
    <div class="base-form__line">
      <app-button type="button" (click)="closeForm()">Cancel</app-button>
      <app-button type="submit" [disabled]="!uploadTrackForm.valid">Add track</app-button>
    </div>
  </form>
</div>
