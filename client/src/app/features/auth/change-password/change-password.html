<form
  class="auth-form"
  id="changePasswordid"
  (submit)="$event.preventDefault(); onSubmit()"
  novalidate
>
  <div class="auth-page-header">
    <h3>Change password!</h3>
  </div>

  <div class="auth-page-main">
    <div class="general-message" [class.error]="generalError()">
      <app-icon [icon]="generalMessage().icon" [style.font-size]="'1.2rem'" />
      <p>{{ generalMessage().message }}</p>
    </div>

    <app-input
      [field]="changePasswordForm.oldPassword"
      label="Old Password"
      autocomplete="password"
      inputType="password"
      placeHolder="Enter your old password"
      appAutofocus
      class="col-span-2"
    />

    <app-input
      [field]="changePasswordForm.newPassword"
      label="New password"
      inputType="password"
      placeHolder="Enter your new password"
      class="col-span-2"
    />

    <app-input
      [field]="changePasswordForm.confirmPassword"
      label="Confirm Password"
      inputType="password"
      autocomplete="current-password"
      placeHolder="Re-enter new password"
      class="col-span-2"
    />
  </div>

  <div class="auth-page-footer">
    <app-button type="button" variant="outline" routerLink="/auth/login" class="switch-btn">
      Sign into existing account
    </app-button>
    <app-button
      type="submit"
      class="submit-btn"
      [disabled]="!changePasswordForm().valid()"
      [class.loading]="store.loading()"
    >
      <app-icon [icon]="submitButton().icon"></app-icon>
      <span>
        {{ submitButton().message }}
      </span>
    </app-button>
  </div>
</form>
