<form class="auth-form" id="loginFormId">
  <app-input
    [field]="loginForm.email"
    label="Email Address"
    inputType="text"
    placeHolder="name@example.com"
  />

  <app-input
    [field]="loginForm.password"
    label="Password"
    inputType="password"
    placeHolder="••••••••"
  />
</form>
