<div class="history-page">
  <div class="history-page-header">
    <h3>{{ historyService.listTitle() }}</h3>

    <input type="date" (change)="onDateChange($event)" class="date-picker" />
  </div>

  <app-tracks-list [viewMode]="'tabs'">
    <ng-template #trackHeader let-track let-idx="index">
      <div class="history-track-meta" [class.is-first]="idx === 0">
        <span class="history-origin-badge" [class.jamendo]="track.origin === 'JAMENDO'">
          {{ track.origin }}
        </span>
        <span class="history-time-badge">
          Played at: {{ track.playedAtDate | date: 'short' }}
        </span>
      </div>
    </ng-template>
  </app-tracks-list>
</div>
