<app-dropdown [alignment]="'right'">
  <button #trigger trigger class="text-primary">
    <app-icon [icon]="getIcon(currentTheme())" />
  </button>
  @for (theme of themes; track theme) {
    <ng-template #item>
      <button item class="text-primary" (click)="changeTheme(theme)" appDropdownClose>
        <app-icon [icon]="getIcon(theme)" />
      </button>
    </ng-template>
  }
</app-dropdown>
