<app-dropdown [alignment]="'right'" #themeDropdown>
  <app-button #trigger trigger class="text-primary" variant="outline" size="icon-cubic-md">
    <app-icon [icon]="getIcon(currentTheme())" />
  </app-button>
  @for (theme of themes; track theme) {
    <ng-template #item>
      <app-button
        size="icon-cubic-sm"
        item
        class="text-primary"
        (click)="changeTheme(theme)"
        [appDropdownClose]="themeDropdown"
      >
        <app-icon [icon]="getIcon(theme)" />
      </app-button>
    </ng-template>
  }
</app-dropdown>
