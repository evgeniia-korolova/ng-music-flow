<article class="track-card" [class.is-playing]="isPlayingTrack()">
  <div class="track-card__cover-wrapper">
    <img class="track-card__cover-img" [src]="track().coverUrl" [alt]="track().title" />
    <button
      class="track-card__play-btn"
      [class.is-playing-now]="isPlayingTrack()"
      [aria-label]="isPlaying() && isCurrentTrack() ? 'Pause' : 'Play'"
      (click)="play(track())"
    >
      <app-icon
        [icon]="isPlaying() && isCurrentTrack() ? 'pause' : 'play'"
        class="text-white"
        style="font-size: 2.5rem"
      />
    </button>
  </div>

  <div class="track-card__info">
    <h3 class="track-card__title">
      {{ track().title }}
    </h3>
    <a [routerLink]="['/artists', track().artist.id]" class="track-card__meta">
      {{ track().artist.name }}
    </a>
    @if (track().album.name) {
      <p class="track-card__meta">
        <span class="track-card__divider">•</span>
        <a [routerLink]="['/albums', track().album.id]" style="font-size: 0.75rem">
          {{ track().album.name }}
        </a>
      </p>
    }
  </div>

  <div class="flex h-8 min-w-0 flex-auto items-center rounded px-3">
    <app-track-waveform
      [isActive]="isCurrentTrack()"
      [progress]="isCurrentTrack() ? progress() : -1"
      [peaks]="track().waveform"
    >
    </app-track-waveform>
  </div>

  <div class="flex flex-none items-center gap-4">
    <span class="font-mono text-xs text-gray-500">
      {{ track().playCount | compactNumberPipe }} plays
    </span>

    <span class="mr-2 font-mono text-xs text-gray-400">
      {{ track().duration | duration }}
    </span>

    <div class="flex items-center gap-2">
      <ng-content></ng-content>
    </div>
  </div>
</article>
