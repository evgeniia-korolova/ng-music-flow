<a class="group block overflow-hidden rounded-lg bg-accent shadow-lg" routerLink=".">
  <div class="aspect-video w-full overflow-hidden bg-gray-400">
    <img
      class="h-full w-full object-cover transition duration-300 ease-in-out group-hover:scale-[1.03]"
      src="{{ artist().image }}"
      alt="{{ artist().name }}"
    />
  </div>
  <div class="flex flex-col gap-1 p-[1em] md:p-[1.5em]">
    <h3 class="truncate text-lg font-semibold">{{ artist().name }}</h3>
    <p class="text-sm">{{ artist().website }}</p>
    <p class="text-sm">{{ artist().joinDate }}</p>
    <p class="text-sm">{{ artist().shortUrl }}</p>
    <p class="text-sm">{{ artist().shareUrl }}</p>
  </div>
</a>
