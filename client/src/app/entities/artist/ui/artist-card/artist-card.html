@if (isLink()) {
  <a
    class="artist-card group flex h-full flex-col overflow-hidden rounded-lg bg-[var(--color-bg-surface)] shadow-lg"
    [routerLink]="['/artists', artist().id]"
  >
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </a>
} @else {
  <article
    class="artist-card group flex h-full flex-col overflow-hidden rounded-lg bg-[var(--color-bg-surface)] shadow-lg"
  >
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </article>
}
<ng-template #cardContent>
  <div class="flex aspect-video w-full items-center justify-center overflow-hidden bg-gray-400">
    <img
      class="h-full w-full object-cover transition duration-300 ease-in-out"
      [src]="artist().image"
      [alt]="artist().name"
      [class.group-hover:scale-105]="isLink()"
      [style.view-transition-name]="'artist-image' + artist().id"
    />
  </div>
  <div class="flex flex-col gap-1 p-[1em] md:p-[1.5em]">
    <h3 class="text-lg font-semibold" [class.hover:underline]="isLink()">
      {{ artist().name }}
    </h3>
    <p class="text-sm truncate">{{ artist().website }}</p>
    <p class="text-sm">{{ artist().joinDate }}</p>
    <p class="text-sm">{{ artist().shortUrl }}</p>
    <p class="text-sm">{{ artist().shareUrl }}</p>
  </div>
</ng-template>
