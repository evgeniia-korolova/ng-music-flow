<a
  class="bg-[var(--color-bg-surface)] group flex flex-col h-full overflow-hidden rounded-lg shadow-lg"
  [routerLink]="isLink() ? ['/artists', artist().id] : null"
  [class.cursor-default]="!isLink()"
>
  <div class="flex aspect-video w-full items-center justify-center overflow-hidden bg-gray-400">
    <img
      class="h-full w-full object-cover transition duration-300 ease-in-out"
      [src]="artist().image"
      [alt]="artist().name"
      [class.group-hover:scale-105]="isLink()"
    />
  </div>
  <div class="flex flex-col items-start gap-1 p-[1em] md:p-[1.5em]">
    <h3 class="truncate text-lg font-semibold" [class.hover:underline]="isLink()">
      {{ artist().name }}
    </h3>
    <p class="text-sm">{{ artist().website }}</p>
    <p class="text-sm">{{ artist().joinDate }}</p>
    <p class="text-sm">{{ artist().shortUrl }}</p>
    <p class="text-sm">{{ artist().shareUrl }}</p>
  </div>
</a>
