<a
  class="bg-[var(--color-surface)] shadow-lg rounded-lg overflow-hidden block group"
  routerLink="."
>
  <div class="w-full aspect-video overflow-hidden bg-gray-400">
    <img
      class="object-cover w-full h-full group-hover:scale-[1.03] transition duration-300 ease-in-out"
      src="{{ artist().image }}"
      alt="{{ artist().name }}"
    />
  </div>
  <div class="p-[1em] md:p-[1.5em] flex flex-col gap-1">
    <h3 class="text-lg font-semibold truncate">{{ artist().name }}</h3>
    <p class="text-sm">{{ artist().website }}</p>
    <p class="text-sm">{{ artist().joinDate }}</p>
    <p class="text-sm">{{ artist().shortUrl }}</p>
    <p class="text-sm">{{ artist().shareUrl }}</p>
  </div>
</a>
