@if (isLink()) {
  <a [routerLink]="['/albums', album().id]" class="album__wrapper">
    <ng-container *ngTemplateOutlet="albumContent"></ng-container>
  </a>
} @else {
  <article class="album__wrapper">
    <ng-container *ngTemplateOutlet="albumContent"></ng-container>
  </article>
}
<ng-template #albumContent>
  <div class="album__image">
    <img [src]="album().image" [alt]="album().name" />
  </div>
  <div class="album__content">
    <h3 class="album__title" [class.hover:underline]="isLink()">{{ album().name }}</h3>
    <p class="album__releasedate">{{ album().releasedate }}</p>
  </div>
</ng-template>
