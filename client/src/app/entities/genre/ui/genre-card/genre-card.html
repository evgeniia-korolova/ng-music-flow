<a
  (click)="onGenreClick(genre().id)"
  (keydown.space)="$event.preventDefault(); onGenreClick(genre().id)"
  class="genre-card__link"
  tabindex="0"
>
  <h3 class="genre-card__title">{{ genre().title }}</h3>
  <div class="genre-card__image">
    <img [src]="genre().image" [alt]="genre().title" />
  </div>
</a>
