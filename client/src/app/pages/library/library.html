<div class="playlists__container">
  <aside class="playlists__aside" aria-label="User playlists">
    <h2 class="playlists__title">My playlists</h2>
    <app-button (click)="openCreateForm()">Create playlist</app-button>
  </aside>
  <section class="playlists__content content-playlists" aria-live="polite">
    @if (isFormShow()) {
      <app-create-playlist-form
        (savedPlayList)="onCreatePlayList($event)"
        (cancelForm)="isFormShow.set(false)"
      ></app-create-playlist-form>
    } @else if (saveCurrentList()) {
      <h3 class="content-playlists__title">List Detail</h3>
    } @else {
      <p class="content-playlists__title">Select a playlist or create a new one</p>
    }
  </section>
</div>
