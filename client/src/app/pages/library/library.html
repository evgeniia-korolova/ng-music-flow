<div class="playlists__container">
  <app-library-sidebar
    [playlists]="playlists()"
    (openUserForm)="openCreateForm()"
    (checkedUserList)="saveCurrentList.set($event)"
    (deleteUserList)="deletePlaylist($event)"
    [class.is-open]="isSideBarOpen()"
  ></app-library-sidebar>
  <app-button
    class="playlists__menu-btn"
    size="icon-rounded-md"
    (click)="isSideBarOpen.set(!isSideBarOpen())"
  >
    @if (!isSideBarOpen()) {
      <app-icon icon="menu"></app-icon>
    } @else {
      <app-icon icon="x"></app-icon>
    }
  </app-button>
  <section class="playlists__content content-playlists" aria-live="polite">
    @if (isFormShow()) {
      <app-create-playlist-form
        (savedPlayList)="onCreatePlayList($event)"
        (cancelForm)="isFormShow.set(false)"
      ></app-create-playlist-form>
    } @else if (saveCurrentList()) {
      <h3 class="content-playlists__title">List Tracks</h3>
    } @else {
      <app-upload-track-form></app-upload-track-form>
    }
  </section>
</div>
