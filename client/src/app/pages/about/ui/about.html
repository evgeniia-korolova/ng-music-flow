<div class="team__wrapper">
  <h1 class="about__title">About our team</h1>
  <div class="team__grid">
    @for (item of teamMembers; track item.name) {
      <div class="team__card card-team">
        <div class="card-team__image">
          <img [src]="item.photo" [alt]="item.name" />
        </div>
        <div class="card-team__content">
          <h3 class="card-team__name">{{ item.name }}</h3>
          <div class="card-team__role">{{ item.role }}</div>
          <div class="card-team__bio">{{ item.shortBio }}</div>
          <a [href]="item.gitLink" target="_blank" rel="noopener noreferrer" class="card-team__link"
            >GitHub Profile</a
          >
        </div>
      </div>
    }
  </div>

  <a href="https://rs.school/" target="_blank" rel="noopener noreferrer" class="team__rs-logo">
    <img src="/rs-logo.svg" alt="RS School Logo" />
  </a>
</div>
