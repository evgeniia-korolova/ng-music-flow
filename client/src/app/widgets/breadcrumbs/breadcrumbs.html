@for (breadcrumb of currentBreadcrumbs.breadcrumbs(); track breadcrumb.url; let isLast = $last) {
  @if (!isLast) {
    <a [routerLink]="breadcrumb.url" class="breadcrumbs__link">{{ breadcrumb.label }}</a>
    <span>/</span>
  } @else {
    <span class="breadcrumbs__span">{{ breadcrumb.label }}</span>
  }
}
