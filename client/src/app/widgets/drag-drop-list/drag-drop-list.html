<div class="drag-drop-list-container">
  <div class="list-header-wrapper">
    <ng-content select="[slot-header]" />

    @if (isOrderChanged()) {
      <button (click)="onSaveOrder()" class="btn-save">💾 Save Order</button>
    }
  </div>

  <div cdkDropList (cdkDropListDropped)="drop($event)" class="track-drop-list">
    @for (track of currentTracks(); track track.id; let index = $index) {
      <div cdkDrag class="track-drag-box">
        <app-track-card [track]="track" [showWave]="showWave()" [playlistContext]="tracks()">
          <ng-container slot-actions>
            <!-- Если включен режим редактирования, покажем крестик -->
            @if (isEditMode()) {
              <button
                class="btn-delete-track"
                (click)="currentTracks.set(currentTracks().filter((t) => t.id !== track.id))"
              >
                ✕
              </button>
            }
          </ng-container>
        </app-track-card>
      </div>
    } @empty {
      <p class="playlist-tracks__empty">No tracks in this playlist</p>
    }
  </div>
</div>
