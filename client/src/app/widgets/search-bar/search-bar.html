<section class="search-bar">
  <button (click)="navigateToSearch()" class="search-bar__icon-search">
    <app-icon icon="search" />
  </button>
  <input
    [formField]="searchForm.query"
    type="text"
    placeholder="Search tracks..."
    (keydown.enter)="navigateToSearch()"
    class="search-bar__input"
  />
  @if (searchForm.query().value()) {
    <button
      type="button"
      (click)="clearSearch()"
      class="search-bar__clear-btn"
      aria-label="Clear search"
    >
      <app-icon icon="x" />
    </button>
  }
</section>
