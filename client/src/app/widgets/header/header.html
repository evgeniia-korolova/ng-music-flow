<header class="sticky flex w-full justify-center bg-secondary">
  <div
    class="relative flex w-full max-w-(--header-width) justify-between px-2 py-2 align-middle md:px-4"
  >
    <div>Navigation</div>
    <div
      class="flex cursor-pointer justify-center rounded-xl border-2 border-primary bg-primary/10 px-2 py-1 align-middle transition-all duration-300 hover:bg-primary/30"
    >
      <picture class="flex h-full w-full justify-center align-middle">
        <source media="(min-width: 768px)" srcset="logo-large.svg" />
        <img src="logo.svg" alt="application logo" class="h-8" />
      </picture>
    </div>
    <div>
      User Login and theme changer
      <svg lucideIcon="log-in"></svg>
    </div>
  </div>
</header>
