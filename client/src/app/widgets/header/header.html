<header>
  <div class="header-container">
    <a class="logo-container" routerLink="/discover/popular">
      <picture>
        <source media="(min-width: 1024px)" srcset="logo-large.svg" />
        <img src="logo.svg" alt="application logo" />
      </picture>
    </a>
    <app-navigation-bar [pathCollection]="navItems" />
    <span class="spacer"></span>

    @if (!authStore.user()) {
      <app-button routerLink="/auth/register" [style.width]="'fit-content'" class="register-button">
        Sign Up
        <app-icon
          icon="logIn"
          variant="fill"
          style="font-size: 1.5rem"
          primaryColor="var(--color-btn-default-border)"
          fillColor="white"
        ></app-icon>
      </app-button>
    } @else {
      <app-dropdown #userMenu alignment="right" class="register-button">
        <app-button trigger #trigger class="register-button">
          Sign Up
          <app-icon
            icon="logIn"
            variant="fill"
            style="font-size: 1.5rem"
            primaryColor="var(--color-btn-default-border)"
            fillColor="white"
          ></app-icon>
        </app-button>
        <ng-template #item>
          <a class="user-menu-item" [appDropdownClose]="userMenu">
            <app-icon
              icon="user"
              variant="fill"
              style="font-size: 1.5rem"
              primaryColor="var(--color-btn-default-border)"
              fillColor="white"
            />
            Profile
          </a>
        </ng-template>
        <ng-template #item>
          <a class="user-menu-item" [appDropdownClose]="userMenu">
            <app-icon
              icon="waveForm"
              variant="fill"
              style="font-size: 1.5rem"
              primaryColor="var(--color-btn-default-border)"
              fillColor="white"
            />
            Your Library
          </a>
        </ng-template>
        <ng-template #item>
          <a class="user-menu-item" [appDropdownClose]="userMenu">
            <app-icon
              icon="keySquare"
              variant="fill"
              style="font-size: 1.5rem"
              primaryColor="var(--color-btn-default-border)"
              fillColor="white"
            />
            Change Password
          </a>
        </ng-template>
        <ng-template #item>
          <a class="user-menu-item" [appDropdownClose]="userMenu">
            <app-icon
              icon="logOut"
              variant="fill"
              style="font-size: 1.5rem"
              primaryColor="var(--color-btn-default-border)"
              fillColor="white"
            />
            Logout
          </a>
        </ng-template>
      </app-dropdown>
    }
    <app-theme-toggler
      [currentTheme]="themeStore.theme()"
      (themeChanged)="themeStore.setTheme($event)"
    />
  </div>
</header>
