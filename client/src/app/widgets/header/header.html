<header class="sticky z-50 flex h-16 w-full justify-center bg-secondary">
  <div
    class="relative flex w-full max-w-(--header-width) justify-between px-2 py-2 align-middle text-primary md:px-4"
  >
    <app-dropdown>
      <button trigger #trigger>
        <svg lucideIcon="menu"></svg>
      </button>
    </app-dropdown>
    <div
      class="absolute top-1/2 left-1/2 flex -translate-x-1/2 -translate-y-1/2 cursor-pointer justify-center rounded-xl border-2 border-primary bg-primary/10 px-2 py-1 align-middle transition-all duration-300 hover:bg-primary/30"
    >
      <picture class="flex h-full w-full justify-center align-middle">
        <source media="(min-width: 768px)" srcset="logo-large.svg" />
        <img src="logo.svg" alt="application logo" class="h-8" />
      </picture>
    </div>
    <div class="flex justify-center gap-10 align-middle">
      <app-dropdown>
        <button trigger #trigger class="flex justify-end gap-2 align-middle">
          Login
          <svg lucideIcon="log-in"></svg>
        </button>
      </app-dropdown>
      <app-theme-toggler
        [currentTheme]="themeStore.theme()"
        (themeChanged)="themeStore.setTheme($event)"
      />
    </div>
  </div>
</header>
