<ul
  class="grid grid-cols-[repeat(auto-fit,minmax(250px,300px))] justify-center gap-[1em] md:gap-[1.5em]"
  aria-label="Artists"
>
  @for (item of store.artists(); track item.id) {
    @defer (on viewport) {
      <li>
        <app-artist-card [artist]="item"></app-artist-card>
      </li>
    } @placeholder (minimum 500ms) {
      <li
        class="bg-[var(--color-surface)] shadow-lg rounded-lg overflow-hidden block animate-pulse w-full h-80"
      ></li>
    }
  }
</ul>
