<ul
  class="grid grid-cols-[repeat(auto-fit,minmax(250px,300px))] justify-center gap-[1em] md:gap-[1.5em]"
  aria-label="Artists"
>
  @for (item of store.artists(); track item.id) {
    @defer (on viewport) {
      <li>
        <app-artist-card [artist]="item"></app-artist-card>
      </li>
    } @placeholder (minimum 500ms) {
      <li
        class="bg-[var(--color-surface)] shadow-lg rounded-lg overflow-hidden block animate-pulse"
      >
        <div class="w-full aspect-video"></div>
        <div class="p-[1em] md:p-[1.5em] flex flex-col gap-1">
          <div class="h-6 bg-gray-300 rounded w-3/4 mb-2"></div>
          <div class="h-4 bg-gray-300 rounded w-1/2"></div>
          <div class="h-4 bg-gray-300 rounded w-1/2"></div>
          <div class="h-4 bg-gray-300 rounded w-1/2"></div>
          <div class="h-4 bg-gray-300 rounded w-1/2"></div>
        </div>
      </li>
    }
  }
</ul>
